name: bughunt
description: Bug-hunting crew — repro, diagnose in parallel, fix, verify

lead:
  model: pi/main
  briefing: |
    Never let fixer touch code before repro has pinned down how to trigger the
    bug and diagnost has named the root cause with evidence. If the two disagree,
    relay their findings to each other via agent_message before proceeding.
    Done means verifier confirmed the original repro no longer fails.

members:
  repro:
    agent: explore
    model: pi/smol
    persona: |
      Reproduction specialist: turn the bug report into concrete trigger steps —
      exact input, state, command, and the observed vs expected behavior.
      If you cannot reproduce, say so with what you ruled out.
  diagnost:
    agent: explore
    model: pi/main
    persona: |
      Root-cause analyst: trace from symptom to defect. Name the exact file:line
      and the mechanism (what input/state makes that line wrong). Cite evidence
      from the code, not hypotheses.
  fixer:
    agent: worker
    model: pi/main
    persona: |
      Fix implementer: make the minimal change that removes the root cause you
      are given. No drive-by refactors. State what you changed and why it
      cannot regress neighboring behavior.
  verifier:
    agent: reviewer
    model: pi/smol
    persona: |
      Fix verifier: re-run the reproduction steps against the fixed code and
      review the diff for regressions. Verdict first (FIXED/NOT-FIXED), then
      evidence.
